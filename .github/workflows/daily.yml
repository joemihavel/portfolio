name: Daily good things

# 05:30 UTC — after the European and US outlets have posted their morning
# pieces, and before most of Joel's day. GitHub's scheduler is best-effort and
# often runs late; nothing here depends on the exact minute.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

# Only one run at a time: two overlapping runs would race on the same commit.
concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      # To commit the day's stories back to the repo.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs here rather than in a Cron Trigger because the Workers free plan
      # allows a scheduled Worker 10ms of CPU and 50 subrequests — nowhere near
      # enough to fetch and parse a dozen feeds and then read an og:image from
      # every selected article.
      - name: Collect today's good things
        run: node scripts/ingest.mjs

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "meanwhile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/meanwhile/days src/data/meanwhile/reserve.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new today."
          else
            git commit -m "Collect good things for $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      # Deploying only when the stories changed keeps this from burning a
      # deployment a day for nothing.
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
