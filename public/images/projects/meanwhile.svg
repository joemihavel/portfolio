<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Stamps scattered on a dotted wall, with a wash of colour behind them">
  <defs>
    <!-- The site's own wash: lavender to peach, low alpha, wide falloff. -->
    <radialGradient id="w1" cx="30%" cy="34%" r="52%">
      <stop offset="0%" stop-color="#E8E0F5" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#E8E0F5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8E0F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w2" cx="72%" cy="66%" r="50%">
      <stop offset="0%" stop-color="#F5E0C8" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#F5E0C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F5E0C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w3" cx="52%" cy="20%" r="38%">
      <stop offset="0%" stop-color="#F3DCE6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3DCE6" stop-opacity="0"/>
    </radialGradient>

    <!-- The dot grid the wall is drawn on. -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#101010" fill-opacity="0.13"/>
    </pattern>

    <!-- One perforated edge, reused for every stamp. -->
    <mask id="perf" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="130">
      <rect width="200" height="130" fill="#fff"/>
      <g fill="#000">
        <circle cx="20" cy="0" r="5"/><circle cx="44" cy="0" r="5"/><circle cx="68" cy="0" r="5"/>
        <circle cx="92" cy="0" r="5"/><circle cx="116" cy="0" r="5"/><circle cx="140" cy="0" r="5"/>
        <circle cx="164" cy="0" r="5"/><circle cx="188" cy="0" r="5"/>
        <circle cx="20" cy="130" r="5"/><circle cx="44" cy="130" r="5"/><circle cx="68" cy="130" r="5"/>
        <circle cx="92" cy="130" r="5"/><circle cx="116" cy="130" r="5"/><circle cx="140" cy="130" r="5"/>
        <circle cx="164" cy="130" r="5"/><circle cx="188" cy="130" r="5"/>
        <circle cx="0" cy="22" r="5"/><circle cx="0" cy="46" r="5"/><circle cx="0" cy="70" r="5"/>
        <circle cx="0" cy="94" r="5"/><circle cx="0" cy="118" r="5"/>
        <circle cx="200" cy="22" r="5"/><circle cx="200" cy="46" r="5"/><circle cx="200" cy="70" r="5"/>
        <circle cx="200" cy="94" r="5"/><circle cx="200" cy="118" r="5"/>
      </g>
    </mask>

    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="#FBFAF7"/>
  <rect width="640" height="420" fill="url(#dots)"/>
  <rect width="640" height="420" fill="url(#w1)"/>
  <rect width="640" height="420" fill="url(#w2)"/>
  <rect width="640" height="420" fill="url(#w3)"/>

  <!-- Back stamp -->
  <g transform="translate(64 52) rotate(-6)" filter="url(#lift)">
    <g mask="url(#perf)">
      <rect width="200" height="130" fill="#F1EDE0"/>
    </g>
    <g fill="#1F4B34" font-family="ui-monospace, Menlo, monospace">
      <text x="20" y="30" font-size="10" letter-spacing="1.6" opacity="0.6">KE · 2H AGO</text>
      <text x="20" y="60" font-size="13">the bakery gave me</text>
      <text x="20" y="80" font-size="13">the broken ones free</text>
      <text x="20" y="112" font-size="10" opacity="0.75">— someone</text>
    </g>
  </g>

  <!-- Front stamp, with a scribble -->
  <g transform="translate(330 176) rotate(5)" filter="url(#lift)">
    <g mask="url(#perf)">
      <rect width="200" height="130" fill="#F4EFE2"/>
    </g>
    <text x="20" y="28" font-size="10" letter-spacing="1.6" fill="#23324F" opacity="0.6"
          font-family="ui-monospace, Menlo, monospace">IN · JUST NOW</text>
    <g fill="none" stroke="#23324F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26 62 q14 -22 30 -2 t28 -4"/>
      <path d="M96 74 c6 -14 22 -12 24 2 c10 -12 24 -2 18 10 c-5 9 -21 16 -30 20 c-8 -6 -16 -18 -12 -32z"/>
    </g>
    <text x="20" y="112" font-size="10" fill="#23324F" opacity="0.75"
          font-family="ui-monospace, Menlo, monospace">— joe</text>
  </g>
</svg>
